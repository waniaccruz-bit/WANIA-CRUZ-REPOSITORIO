<svg width="640" height="660" viewBox="0 0 640 660" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a34a"/>
      <stop offset="45%" style="stop-color:#f3d585"/>
      <stop offset="100%" style="stop-color:#bd8a35"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#bd8a35"/>
      <stop offset="50%" style="stop-color:#f3d585"/>
      <stop offset="100%" style="stop-color:#bd8a35"/>
    </linearGradient>
    <linearGradient id="navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a"/>
      <stop offset="100%" style="stop-color:#16314c"/>
    </linearGradient>
  </defs>

  <rect width="640" height="660" fill="#f4f6f9"/>

  <!-- ============ CONCEITO A: COLUNAS (FACHADA BANCARIA) ============ -->
  <text x="30" y="35" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#16314c">CONCEITO A — Colunas (fachada institucional)</text>
  <rect x="30" y="50" width="580" height="150" rx="8" fill="url(#navy)"/>
  <g transform="translate(60,78)">
    <!-- Frontao triangular -->
    <polygon points="40,0 80,22 0,22" fill="url(#gold)"/>
    <!-- Arquitrave -->
    <rect x="2" y="24" width="76" height="7" fill="url(#gold)"/>
    <!-- Colunas -->
    <rect x="8" y="33" width="9" height="55" fill="url(#gold)"/>
    <rect x="25" y="33" width="9" height="55" fill="url(#gold)"/>
    <rect x="46" y="33" width="9" height="55" fill="url(#gold)"/>
    <rect x="63" y="33" width="9" height="55" fill="url(#gold)"/>
    <!-- Base -->
    <rect x="0" y="90" width="80" height="8" fill="url(#gold)"/>
  </g>
  <text x="165" y="120" font-family="Georgia, serif" font-size="34" font-weight="700" fill="url(#gold)" letter-spacing="3">EXCLUSIVA</text>
  <text x="167" y="146" font-family="'Segoe UI', sans-serif" font-size="15" fill="#e8ecf1" letter-spacing="7">SERVICE</text>
  <line x1="167" y1="156" x2="585" y2="156" stroke="url(#goldH)" stroke-width="1.2"/>
  <text x="167" y="176" font-family="'Segoe UI', sans-serif" font-size="11" fill="#9fb3c4" letter-spacing="1">Servicos Financeiros Imobiliarios</text>

  <!-- ============ CONCEITO B: MONOGRAMA EM SELO/MEDALHAO ============ -->
  <text x="30" y="245" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#16314c">CONCEITO B — Monograma E em selo (autoridade)</text>
  <rect x="30" y="260" width="580" height="150" rx="8" fill="url(#navy)"/>
  <g transform="translate(62,278)">
    <!-- Aneis do selo -->
    <circle cx="57" cy="57" r="54" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
    <circle cx="57" cy="57" r="45" fill="none" stroke="url(#gold)" stroke-width="1"/>
    <!-- Letra E serifada -->
    <text x="57" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="62" font-weight="700" fill="url(#gold)">E</text>
    <!-- estrelas decorativas -->
    <circle cx="57" cy="8" r="2.2" fill="url(#gold)"/>
    <circle cx="57" cy="106" r="2.2" fill="url(#gold)"/>
  </g>
  <text x="195" y="328" font-family="Georgia, serif" font-size="34" font-weight="700" fill="url(#gold)" letter-spacing="3">EXCLUSIVA</text>
  <text x="197" y="354" font-family="'Segoe UI', sans-serif" font-size="15" fill="#e8ecf1" letter-spacing="7">SERVICE</text>
  <line x1="197" y1="364" x2="585" y2="364" stroke="url(#goldH)" stroke-width="1.2"/>
  <text x="197" y="384" font-family="'Segoe UI', sans-serif" font-size="11" fill="#9fb3c4" letter-spacing="1">Servicos Financeiros Imobiliarios</text>

  <!-- ============ CONCEITO C: ESCUDO + TORRE (SEGURANCA/ATIVO) ============ -->
  <text x="30" y="455" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#16314c">CONCEITO C — Escudo com torre (seguranca do ativo)</text>
  <rect x="30" y="470" width="580" height="150" rx="8" fill="url(#navy)"/>
  <g transform="translate(64,486)">
    <!-- Escudo -->
    <path d="M52 2 L100 16 L100 60 Q100 100 52 116 Q4 100 4 60 L4 16 Z" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
    <path d="M52 14 L88 24 L88 60 Q88 90 52 102 Q16 90 16 60 L16 24 Z" fill="url(#gold)" opacity="0.12"/>
    <!-- Torre / predio dentro do escudo -->
    <rect x="38" y="40" width="12" height="48" fill="url(#gold)"/>
    <rect x="54" y="52" width="10" height="36" fill="url(#gold)"/>
    <!-- janelas -->
    <rect x="41" y="46" width="2.5" height="2.5" fill="#16314c"/>
    <rect x="46" y="46" width="2.5" height="2.5" fill="#16314c"/>
    <rect x="41" y="54" width="2.5" height="2.5" fill="#16314c"/>
    <rect x="46" y="54" width="2.5" height="2.5" fill="#16314c"/>
    <rect x="41" y="62" width="2.5" height="2.5" fill="#16314c"/>
    <rect x="46" y="62" width="2.5" height="2.5" fill="#16314c"/>
  </g>
  <text x="195" y="538" font-family="Georgia, serif" font-size="34" font-weight="700" fill="url(#gold)" letter-spacing="3">EXCLUSIVA</text>
  <text x="197" y="564" font-family="'Segoe UI', sans-serif" font-size="15" fill="#e8ecf1" letter-spacing="7">SERVICE</text>
  <line x1="197" y1="574" x2="585" y2="574" stroke="url(#goldH)" stroke-width="1.2"/>
  <text x="197" y="594" font-family="'Segoe UI', sans-serif" font-size="11" fill="#9fb3c4" letter-spacing="1">Servicos Financeiros Imobiliarios</text>

  <text x="320" y="645" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#7f8c8d">Exclusiva Service — 3 conceitos premium · azul-marinho e dourado</text>
</svg>
