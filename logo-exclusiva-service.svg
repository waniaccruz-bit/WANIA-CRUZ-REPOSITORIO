<svg width="580" height="148" viewBox="0 0 290 74" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a34a"/>
      <stop offset="50%" style="stop-color:#f0d07a"/>
      <stop offset="100%" style="stop-color:#c4923a"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c4923a"/>
      <stop offset="50%" style="stop-color:#f0d07a"/>
      <stop offset="100%" style="stop-color:#c4923a"/>
    </linearGradient>
  </defs>
  <!-- Fundo azul-marinho -->
  <rect width="290" height="74" rx="6" fill="#0d1b2a"/>
  <!-- Icone: predios (skyline) -->
  <g fill="url(#goldGrad)">
    <rect x="4" y="14" width="20" height="50"/>
    <rect x="27" y="28" width="16" height="36"/>
  </g>
  <!-- Janelas predio alto -->
  <g fill="#0d1b2a">
    <rect x="8" y="19" width="4" height="4"/>
    <rect x="16" y="19" width="4" height="4"/>
    <rect x="8" y="27" width="4" height="4"/>
    <rect x="16" y="27" width="4" height="4"/>
    <rect x="8" y="35" width="4" height="4"/>
    <rect x="16" y="35" width="4" height="4"/>
    <rect x="8" y="43" width="4" height="4"/>
    <rect x="16" y="43" width="4" height="4"/>
    <rect x="8" y="51" width="4" height="4"/>
    <rect x="16" y="51" width="4" height="4"/>
    <!-- Janelas predio baixo -->
    <rect x="31" y="33" width="3.5" height="3.5"/>
    <rect x="37" y="33" width="3.5" height="3.5"/>
    <rect x="31" y="41" width="3.5" height="3.5"/>
    <rect x="37" y="41" width="3.5" height="3.5"/>
    <rect x="31" y="49" width="3.5" height="3.5"/>
    <rect x="37" y="49" width="3.5" height="3.5"/>
  </g>
  <!-- EXCLUSIVA -->
  <text x="58" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="url(#goldGrad)" letter-spacing="2">EXCLUSIVA</text>
  <!-- SERVICE -->
  <text x="60" y="51" font-family="'Segoe UI', Tahoma, sans-serif" font-size="13" font-weight="400" fill="#e8ecf1" letter-spacing="5">SERVICE</text>
  <!-- Linha decorativa -->
  <line x1="60" y1="58" x2="285" y2="58" stroke="url(#goldGrad2)" stroke-width="1"/>
  <!-- Subtitulo -->
  <text x="60" y="69" font-family="'Segoe UI', Tahoma, sans-serif" font-size="9" fill="#9fb3c4" letter-spacing="0.5">Servicos Financeiros Imobiliarios</text>
</svg>
