<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neo Service - Auditoria de Recebiveis</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ===== RESET & BASE ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1a2332;--navy2:#0E6B6E;--accent:#0E6B6E;--teal:#0E7C7B;
  --bg:#f4f6f9;--white:#fff;--border:#dce1e8;--text:#2d3748;--text-light:#888888;
  --success:#38a169;--warning:#d69e2e;--danger:#e53e3e;
  --sidebar-w:240px;--header-h:60px;
  --neo-teal:#0E6B6E;--neo-gray:#888888;
}
html{font-size:13px}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit}
table{border-collapse:collapse;width:100%}
input,select{font-family:inherit;font-size:inherit}

/* ===== HEADER ===== */
.header{height:var(--header-h);background:linear-gradient(135deg,#1a2332,#1e2d3d);display:flex;align-items:center;padding:0 24px;gap:24px;color:#fff;position:fixed;top:0;left:0;right:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.logo{font-size:1.6rem;font-weight:700;letter-spacing:4px;color:var(--neo-teal);text-transform:uppercase;white-space:nowrap;font-family:'Century Gothic','Segoe UI',sans-serif}
.logo span{color:var(--neo-gray);font-weight:300;letter-spacing:8px;font-size:0.85rem}
.header-title{flex:1;font-size:1rem;font-weight:400;color:#cbd5e0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.model-select{display:flex;align-items:center;gap:8px;white-space:nowrap}
.model-select label{font-size:.85rem;color:#a0aec0}
.model-select select{padding:6px 12px;border:1px solid rgba(255,255,255,.2);border-radius:6px;background:rgba(255,255,255,.1);color:#fff;font-size:.85rem;cursor:pointer}
.model-select select option{background:var(--navy);color:#fff}

/* ===== LAYOUT ===== */
.app{display:flex;margin-top:var(--header-h);flex:1}

/* ===== SIDEBAR ===== */
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:#1a2332;position:fixed;top:var(--header-h);bottom:0;left:0;overflow-y:auto;z-index:90;transition:transform .3s}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:var(--accent);border-radius:4px}
.sidebar .tab-btn{display:flex;align-items:center;gap:10px;width:100%;padding:11px 18px;border:none;background:none;color:#a0aec0;font-size:.82rem;text-align:left;cursor:pointer;transition:all .2s;border-left:3px solid transparent}
.sidebar .tab-btn:hover{background:rgba(255,255,255,.05);color:#fff}
.sidebar .tab-btn.active{background:rgba(14,107,110,.15);color:var(--teal);border-left-color:var(--teal);font-weight:600}
.sidebar .tab-btn i{width:18px;text-align:center;font-size:.9rem}
.sidebar .sep{height:1px;background:rgba(255,255,255,.08);margin:6px 18px}

/* ===== MAIN ===== */
.main{flex:1;margin-left:var(--sidebar-w);padding:24px;overflow-x:hidden}
.tab-content{display:none}
.tab-content.active{display:block}

/* ===== CARDS & SECTIONS ===== */
.section-title{font-size:1.1rem;font-weight:700;color:var(--accent);margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid var(--teal)}
.card{background:var(--white);border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:18px;margin-bottom:18px}
.card-header{font-size:.95rem;font-weight:700;color:var(--accent);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-header i{color:var(--teal)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
.grid-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:18px}

/* ===== TABLES ===== */
.table-wrap{overflow-x:auto;border-radius:6px;border:1px solid var(--border)}
table.data{font-size:.78rem}
table.data thead{background:var(--accent);color:#fff;position:sticky;top:0;z-index:2}
table.data th{padding:8px 10px;font-weight:600;white-space:nowrap;text-align:left;border-right:1px solid rgba(255,255,255,.1)}
table.data td{padding:7px 10px;border-bottom:1px solid var(--border);border-right:1px solid #f0f0f0;white-space:nowrap}
table.data tbody tr:hover{background:#edf2f7}
table.data tbody tr:nth-child(even){background:#fafbfc}
table.data tbody tr:nth-child(even):hover{background:#edf2f7}
table.data .num{text-align:right;font-variant-numeric:tabular-nums}
table.data .center{text-align:center}

table.summary{font-size:.8rem;width:100%}
table.summary th{background:var(--accent);color:#fff;padding:6px 10px;text-align:left;font-weight:600;white-space:nowrap}
table.summary td{padding:5px 10px;border-bottom:1px solid var(--border)}
table.summary .num{text-align:right}
table.summary .label{font-weight:600;color:var(--accent)}
table.summary .sub{padding-left:20px;color:var(--text-light)}
table.summary .total{font-weight:700;background:#edf2f7}

.stat-card{background:var(--white);border-radius:8px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);text-align:center;border-top:3px solid var(--teal)}
.stat-card .value{font-size:1.4rem;font-weight:700;color:var(--accent)}
.stat-card .label{font-size:.75rem;color:var(--text-light);margin-top:4px}

.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.7rem;font-weight:600}
.badge-ok{background:#c6f6d5;color:#22543d}
.badge-warn{background:#fefcbf;color:#744210}
.badge-danger{background:#fed7d7;color:#9b2c2c}
.badge-info{background:#bee3f8;color:#2a4365}

/* ===== UPLOAD AREA ===== */
.upload-section{max-width:900px;margin:0 auto}
.upload-header{text-align:center;margin-bottom:28px}
.upload-header h2{font-size:1.5rem;color:var(--accent);margin-bottom:6px}
.upload-header p{color:var(--text-light);font-size:.9rem}

.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px}
.upload-card{background:var(--white);border:2px dashed var(--border);border-radius:10px;padding:18px 16px;text-align:center;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.upload-card:hover{border-color:var(--teal);background:#f0fafa}
.upload-card.loaded{border-color:var(--success);border-style:solid;background:#f0fff4}
.upload-card.error{border-color:var(--danger);border-style:solid;background:#fff5f5}
.upload-card .uc-icon{font-size:1.8rem;color:var(--teal);margin-bottom:8px}
.upload-card.loaded .uc-icon{color:var(--success)}
.upload-card .uc-title{font-weight:700;font-size:.9rem;color:var(--accent);margin-bottom:3px}
.upload-card .uc-tag{display:inline-block;font-size:.65rem;font-weight:700;padding:1px 8px;border-radius:8px;margin-bottom:6px}
.upload-card .uc-tag.required{background:#fed7d7;color:#9b2c2c}
.upload-card .uc-tag.optional{background:#fefcbf;color:#744210}
.upload-card .uc-tag.conditional{background:#bee3f8;color:#2a4365}
.upload-card .uc-hint{font-size:.72rem;color:var(--text-light)}
.upload-card .uc-file{font-size:.75rem;color:var(--success);font-weight:600;margin-top:6px;word-break:break-all}
.upload-card .uc-stats{font-size:.7rem;color:var(--text-light);margin-top:2px}
.upload-card .uc-remove{position:absolute;top:6px;right:8px;background:none;border:none;color:var(--danger);cursor:pointer;font-size:.9rem;opacity:0;transition:opacity .2s}
.upload-card:hover .uc-remove{opacity:1}
.upload-card input[type=file]{display:none}

.params-card{background:var(--white);border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:20px;margin-bottom:20px}
.params-card h3{font-size:1rem;font-weight:700;color:var(--accent);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.params-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.param-field label{display:block;font-size:.75rem;font-weight:600;color:var(--text-light);margin-bottom:3px}
.param-field input,.param-field select{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:.85rem;background:#fafbfc}
.param-field input:focus,.param-field select:focus{outline:none;border-color:var(--teal);background:#fff}

.action-bar{display:flex;gap:12px;justify-content:center;margin-top:24px;flex-wrap:wrap}
.btn{padding:10px 28px;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;border:none;display:flex;align-items:center;gap:8px;transition:all .2s}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover:not(:disabled){background:#0a5558}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover:not(:disabled){background:#2f855a}
.btn-outline{background:none;border:2px solid var(--accent);color:var(--accent)}
.btn-outline:hover:not(:disabled){background:var(--accent);color:#fff}

.progress-bar{width:100%;height:6px;background:#e2e8f0;border-radius:3px;margin-top:12px;overflow:hidden;display:none}
.progress-bar.active{display:block}
.progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--accent));border-radius:3px;transition:width .4s;width:0}

.preview-summary{background:var(--white);border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:18px;margin-top:18px;display:none}
.preview-summary.active{display:block}
.preview-summary h3{font-size:1rem;font-weight:700;color:var(--accent);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.preview-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.preview-stat{text-align:center;padding:10px;background:#f7fafc;border-radius:6px}
.preview-stat .pv{font-size:1.3rem;font-weight:700;color:var(--accent)}
.preview-stat .pl{font-size:.7rem;color:var(--text-light)}

.step-indicator{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:28px}
.step{display:flex;align-items:center;gap:0}
.step-circle{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;border:2px solid var(--border);color:var(--text-light);background:#fff;transition:all .3s}
.step.active .step-circle{border-color:var(--accent);background:var(--accent);color:#fff}
.step.done .step-circle{border-color:var(--success);background:var(--success);color:#fff}
.step-label{font-size:.7rem;color:var(--text-light);margin-top:4px;text-align:center;width:80px}
.step.active .step-label{color:var(--accent);font-weight:600}
.step.done .step-label{color:var(--success)}
.step-line{width:60px;height:2px;background:var(--border);margin:0 4px}
.step.done+.step-line,.step-line.done{background:var(--success)}

/* ===== FOOTER ===== */
.footer{background:var(--navy);color:#718096;text-align:center;padding:12px;font-size:.75rem;letter-spacing:1px}

/* ===== RESPONSIVE ===== */
@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .grid-2,.upload-grid,.params-grid{grid-template-columns:1fr}
  .header{padding:0 12px}
  .menu-toggle{display:block!important}
  .preview-stats{grid-template-columns:1fr 1fr}
}
.menu-toggle{display:none;background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer;margin-right:8px}

/* ===== PRINT ===== */
@media print{
  .header,.sidebar,.footer,.menu-toggle,.model-select,.upload-section,.action-bar{display:none!important}
  .main{margin-left:0!important;padding:0!important}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  table.data th{background:#ddd!important;color:#000!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff}
}

.field-input{border:1px solid var(--border);border-radius:4px;padding:4px 8px;background:#fafbfc;color:var(--text);font-size:.8rem;width:100%;min-width:60px}
.field-input:focus{outline:none;border-color:var(--teal);background:#fff}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')"><i class="fas fa-bars"></i></button>
  <div class="logo">NEO <span>SERVICE</span></div>
  <div class="header-title">Auditoria Documental e Financeira dos Recebiveis</div>
  <div class="model-select">
    <label>Modelo:</label>
    <select id="modelSelect" onchange="changeModel(this.value)">
      <option value="sem">Sem Projecao</option>
      <option value="previa">Para Previa</option>
      <option value="com">Com Projecao</option>
    </select>
  </div>
</header>

<div class="app">
  <!-- SIDEBAR -->
  <nav class="sidebar" id="sidebar"></nav>

  <!-- MAIN -->
  <main class="main" id="mainContent"></main>
</div>

<!-- FOOTER -->
<footer class="footer">Neo Service - Auditoria de Recebiveis - Confidencial</footer>

<script>
// ===================================================================
// GLOBAL STATE
// ===================================================================
const FILES = {
  contratos:    {key:'contratos',    title:'Relacao de Contratos',    tag:'required',     icon:'fa-file-signature',  accept:'.xlsx,.xls,.csv', hint:'ID, Unidade, Cliente, Empreendimento, Valor, Status', data:null, name:null},
  parcelas:     {key:'parcelas',     title:'Parcelas em Aberto',     tag:'required',     icon:'fa-list-ol',         accept:'.xlsx,.xls,.csv', hint:'Parcelas a vencer com datas e valores',               data:null, name:null},
  recebimentos: {key:'recebimentos', title:'Recebimentos Historico', tag:'required',     icon:'fa-money-bill-wave', accept:'.xlsx,.xls,.csv', hint:'Historico de pagamentos recebidos',                   data:null, name:null},
  cadastrais:   {key:'cadastrais',   title:'Dados Cadastrais',       tag:'required',     icon:'fa-id-card',         accept:'.xlsx,.xls,.csv', hint:'CPF, enderecos, dados do comprador',                  data:null, name:null},
  unidades:     {key:'unidades',     title:'Relacao de Unidades',    tag:'required',     icon:'fa-building',        accept:'.xlsx,.xls,.csv', hint:'Espelho de vendas, areas, status das unidades',       data:null, name:null},
  distratos:    {key:'distratos',    title:'Historico de Distratos', tag:'optional',     icon:'fa-file-circle-xmark',accept:'.xlsx,.xls,.csv',hint:'Contratos distratados com datas e valores',           data:null, name:null},
  extrato:      {key:'extrato',      title:'Extrato Bancario',       tag:'conditional',  icon:'fa-university',      accept:'.xlsx,.xls,.csv', hint:'Necessario para modelos com Conciliacao',             data:null, name:null},
  aud_documental:{key:'aud_documental',title:'Auditoria Documental',  tag:'optional',     icon:'fa-file-circle-check',accept:'.xlsx,.xls,.csv', hint:'Checklist documental e verificacoes de conformidade', data:null, name:null},
  aud_financeira:{key:'aud_financeira',title:'Auditoria Financeira',  tag:'optional',     icon:'fa-calculator',      accept:'.xlsx,.xls,.csv', hint:'Analise financeira e conciliacao de valores',         data:null, name:null}
};

let currentModel = 'sem';
let currentTab = 'upload';
let auditData = null;

// ===================================================================
// TAB DEFINITIONS
// ===================================================================
const TABS = {
  sem: [
    {id:'upload',label:'Upload de Arquivos',icon:'fa-cloud-arrow-up'},
    {id:'sep1'},
    {id:'visao',label:'Visao Geral',icon:'fa-chart-pie'},
    {id:'estudo',label:'Estudo de Unidades',icon:'fa-building'},
    {id:'resumo',label:'Resumo Unidades',icon:'fa-list-alt'},
    {id:'recebimentos',label:'Recebimentos',icon:'fa-money-bill-wave'},
    {id:'conciliacao',label:'Conciliacao',icon:'fa-balance-scale'},
    {id:'behaviour',label:'Behaviour',icon:'fa-chart-bar'},
    {id:'distratos',label:'Distratos',icon:'fa-file-circle-xmark'},
    {id:'receb_cedente',label:'Recebiveis Cedente',icon:'fa-file-invoice-dollar'},
    {id:'aging_cedente',label:'Aging Cedente',icon:'fa-clock'},
    {id:'receb_neo',label:'Recebiveis Neo',icon:'fa-file-invoice'},
    {id:'aging_neo',label:'Aging Neo',icon:'fa-hourglass-half'},
    {id:'inadimplencia',label:'Inadimplencia',icon:'fa-exclamation-triangle'},
    {id:'base_full',label:'Base Full',icon:'fa-database'},
    {id:'espelho',label:'Espelho de Vendas',icon:'fa-store'},
    {id:'auditoria_doc',label:'Auditoria Documental',icon:'fa-file-contract'},
    {id:'cessao',label:'Cessao de Credito',icon:'fa-handshake'}
  ],
  previa: [
    {id:'upload',label:'Upload de Arquivos',icon:'fa-cloud-arrow-up'},
    {id:'sep1'},
    {id:'visao',label:'Visao Geral',icon:'fa-chart-pie'},
    {id:'estudo',label:'Estudo de Unidades',icon:'fa-building'},
    {id:'resumo',label:'Resumo Unidades',icon:'fa-list-alt'},
    {id:'relacao',label:'Relacao de Contratos',icon:'fa-file-lines'},
    {id:'recebimentos',label:'Recebimentos',icon:'fa-money-bill-wave'},
    {id:'behaviour',label:'Behaviour',icon:'fa-chart-bar'},
    {id:'distratos',label:'Distratos',icon:'fa-file-circle-xmark'},
    {id:'recebiveis',label:'Recebiveis',icon:'fa-file-invoice-dollar'},
    {id:'aging',label:'Aging',icon:'fa-clock'},
    {id:'inadimplencia',label:'Inadimplencia',icon:'fa-exclamation-triangle'},
    {id:'base_full',label:'Base Full',icon:'fa-database'},
    {id:'espelho',label:'Espelho de Vendas',icon:'fa-store'}
  ],
  com: [
    {id:'upload',label:'Upload de Arquivos',icon:'fa-cloud-arrow-up'},
    {id:'sep1'},
    {id:'visao',label:'Visao Geral',icon:'fa-chart-pie'},
    {id:'estudo',label:'Estudo de Unidades',icon:'fa-building'},
    {id:'resumo',label:'Resumo Unidades',icon:'fa-list-alt'},
    {id:'conciliacao',label:'Conciliacao',icon:'fa-balance-scale'},
    {id:'recebimentos',label:'Recebimentos',icon:'fa-money-bill-wave'},
    {id:'behaviour',label:'Behaviour',icon:'fa-chart-bar'},
    {id:'distratos',label:'Distratos',icon:'fa-file-circle-xmark'},
    {id:'receb_cedente',label:'Recebiveis Cedente',icon:'fa-file-invoice-dollar'},
    {id:'aging_cedente',label:'Aging Cedente',icon:'fa-clock'},
    {id:'aging_ced_proj',label:'Aging Cedente Projetado',icon:'fa-clock-rotate-left'},
    {id:'receb_neo',label:'Recebiveis Neo',icon:'fa-file-invoice'},
    {id:'aging_neo',label:'Aging Neo',icon:'fa-hourglass-half'},
    {id:'aging_neo_proj',label:'Aging Neo Projetado',icon:'fa-hourglass-start'},
    {id:'inadimplencia',label:'Inadimplencia',icon:'fa-exclamation-triangle'},
    {id:'base_full',label:'Base Full',icon:'fa-database'},
    {id:'espelho',label:'Espelho de Vendas',icon:'fa-store'},
    {id:'auditoria_doc',label:'Auditoria Documental',icon:'fa-file-contract'},
    {id:'cessao',label:'Cessao de Credito',icon:'fa-handshake'}
  ]
};

// ===================================================================
// NAVIGATION
// ===================================================================
function changeModel(m) {
  currentModel = m;
  currentTab = 'upload';
  render();
}

function selectTab(id) {
  currentTab = id;
  document.querySelectorAll('.sidebar .tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab-'+id));
}

function render() {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = TABS[currentModel].map(t => {
    if(t.id.startsWith('sep')) return '<div class="sep"></div>';
    return `<button class="tab-btn${t.id===currentTab?' active':''}" data-tab="${t.id}" onclick="selectTab('${t.id}')"><i class="fas ${t.icon}"></i>${t.label}</button>`;
  }).join('');

  const mc = document.getElementById('mainContent');
  mc.innerHTML = TABS[currentModel].filter(t=>!t.id.startsWith('sep')).map(t =>
    `<div class="tab-content${t.id===currentTab?' active':''}" id="tab-${t.id}">${generateTabContent(t.id, currentModel)}</div>`
  ).join('');
}

// ===================================================================
// HELPERS
// ===================================================================
function R(v){return `R$ ${v||'0,00'}`}
function P(v){return `${v||'0,00'}%`}
function D(v){return v||'dd/mm/aaaa'}
function fmtR(n){if(n==null||isNaN(n))return'R$ 0,00';return'R$ '+Number(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtP(n){if(n==null||isNaN(n))return'0,00%';return(Number(n)*100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%'}
function fmtN(n){if(n==null||isNaN(n))return'0';return Number(n).toLocaleString('pt-BR')}
function fmtD(v){
  if(!v) return'-';
  if(typeof v==='number'){
    const d=new Date((v-25569)*86400000);
    return d.toLocaleDateString('pt-BR');
  }
  if(v instanceof Date) return v.toLocaleDateString('pt-BR');
  return String(v);
}

function summaryRow(label, val, cls='') {
  return `<tr class="${cls}"><td class="label">${label}</td><td class="num">${val}</td></tr>`;
}
function summaryRowSub(label, val) {
  return `<tr><td class="sub">${label}</td><td class="num">${val}</td></tr>`;
}

// ===================================================================
// FILE UPLOAD HANDLING
// ===================================================================
function handleFileUpload(key, inputEl) {
  const file = inputEl.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      let data;
      if(file.name.endsWith('.csv')) {
        const text = e.target.result;
        const wb = XLSX.read(text, {type:'string'});
        data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:''});
      } else {
        const ab = e.target.result;
        const wb = XLSX.read(ab, {type:'array'});
        data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:''});
      }
      FILES[key].data = data;
      FILES[key].name = file.name;
      updateUploadCards();
    } catch(err) {
      FILES[key].data = null;
      FILES[key].name = null;
      const card = document.getElementById('uc-'+key);
      if(card){card.classList.remove('loaded');card.classList.add('error');}
      alert('Erro ao ler arquivo: '+err.message);
    }
  };
  if(file.name.endsWith('.csv')) reader.readAsText(file);
  else reader.readAsArrayBuffer(file);
}

function removeFile(key, ev) {
  ev.stopPropagation();
  FILES[key].data = null;
  FILES[key].name = null;
  const inp = document.querySelector(`#uc-${key} input[type=file]`);
  if(inp) inp.value='';
  updateUploadCards();
}

function updateUploadCards() {
  Object.values(FILES).forEach(f => {
    const card = document.getElementById('uc-'+f.key);
    if(!card) return;
    card.classList.remove('loaded','error');
    const fileInfo = card.querySelector('.uc-file');
    const statsInfo = card.querySelector('.uc-stats');
    if(f.data) {
      card.classList.add('loaded');
      fileInfo.textContent = f.name;
      statsInfo.textContent = f.data.length + ' registros encontrados';
    } else {
      fileInfo.textContent = '';
      statsInfo.textContent = '';
    }
  });
  updateStepIndicator();
  updateActionButtons();
}

function updateStepIndicator() {
  const reqFiles = ['contratos','parcelas','recebimentos','cadastrais','unidades'];
  const reqLoaded = reqFiles.filter(k => FILES[k].data !== null).length;
  const allReqDone = reqLoaded === reqFiles.length;
  const needExtrato = (currentModel==='sem'||currentModel==='com');
  const extratoOk = !needExtrato || FILES.extrato.data !== null;

  const s1 = document.getElementById('step-1');
  const s2 = document.getElementById('step-2');
  const s3 = document.getElementById('step-3');
  if(!s1) return;

  s1.className = 'step active';
  s2.className = 'step';
  s3.className = 'step';

  if(allReqDone) {
    s1.className = 'step done';
    s2.className = 'step active';
  }
  if(auditData) {
    s2.className = 'step done';
    s3.className = 'step active';
  }
}

function updateActionButtons() {
  const reqFiles = ['contratos','parcelas','recebimentos','cadastrais','unidades'];
  const allReqDone = reqFiles.every(k => FILES[k].data !== null);
  const btnProcess = document.getElementById('btnProcessar');
  const btnExport = document.getElementById('btnExportar');
  if(btnProcess) btnProcess.disabled = !allReqDone;
  if(btnExport) btnExport.disabled = !auditData;
}

// ===================================================================
// DATA PROCESSING ENGINE
// ===================================================================
function processarDados() {
  const bar = document.querySelector('.progress-bar');
  const fill = bar.querySelector('.fill');
  bar.classList.add('active');
  fill.style.width = '10%';

  setTimeout(() => {
    try {
      const contratos = FILES.contratos.data || [];
      const parcelas = FILES.parcelas.data || [];
      const recebimentos = FILES.recebimentos.data || [];
      const cadastrais = FILES.cadastrais.data || [];
      const unidades = FILES.unidades.data || [];
      const distratos = FILES.distratos.data || [];
      const extrato = FILES.extrato.data || [];

      fill.style.width = '30%';

      const params = {
        dataBase: document.getElementById('paramDataBase')?.value || '',
        taxaOp: parseFloat((document.getElementById('paramTaxaOp')?.value||'0').replace(',','.'))/100 || 0.149,
        prazoOp: parseInt(document.getElementById('paramPrazoOp')?.value||'120') || 120,
        inicioOp: document.getElementById('paramInicioOp')?.value || '',
        cdi: document.getElementById('paramCDI')?.value || 'CDI 14,90% a.a'
      };

      fill.style.width = '50%';

      // Build lookup maps
      const contratoMap = {};
      contratos.forEach(c => {
        const id = c.ID_Contrato || c.id_contrato || c.Id || c.id || Object.values(c)[0];
        contratoMap[id] = c;
      });

      // Calculate totals
      let totalSDNominal = 0, totalSDVP = 0, totalElegivel = 0, totalInelegivel = 0;
      let parcelasPorTipo = {Mensal:0,Anual:0,Semestral:0,Unica:0,Entrada:0,Financiamento:0,Permuta:0,Trimestral:0};
      let sdPorTipo = {Mensal:0,Anual:0,Semestral:0,Unica:0,Entrada:0,Financiamento:0,Permuta:0,Trimestral:0};
      let totalParcelas = 0;

      parcelas.forEach(p => {
        const val = parseFloat(p['Valor Corrigido']||p['Valor_Corrigido']||p.valor_corrigido||p.Valor||p.valor||0);
        const vpOp = parseFloat(p['VP. Op.']||p['VP_Op']||p.vp_op||val);
        const status = String(p.Status||p.status||p.Elegibilidade||p.elegibilidade||'').toLowerCase();
        const tipo = p['Tipo de Parcela']||p['Tipo_Parcela']||p.tipo_parcela||p.Tipo||'Mensal';

        totalSDNominal += val;
        totalSDVP += vpOp;
        totalParcelas++;

        if(status.includes('ineleg')) totalInelegivel += vpOp;
        else totalElegivel += vpOp;

        const tk = Object.keys(parcelasPorTipo).find(k=>tipo.toLowerCase().includes(k.toLowerCase())) || 'Mensal';
        parcelasPorTipo[tk] = (parcelasPorTipo[tk]||0)+1;
        sdPorTipo[tk] = (sdPorTipo[tk]||0)+vpOp;
      });

      fill.style.width = '70%';

      // Inadimplencia
      const inadCategories = {'1 a 30 dias':0,'31 a 60 dias':0,'61 a 90 dias':0,'91 a 120 dias':0,'121 a 150 dias':0,'151 a 180 dias':0,'Acima de 180 dias':0};
      const inadContratos = {'1 a 30 dias':0,'31 a 60 dias':0,'61 a 90 dias':0,'91 a 120 dias':0,'121 a 150 dias':0,'151 a 180 dias':0,'Acima de 180 dias':0};
      let totalInad = 0;

      parcelas.forEach(p => {
        const st = String(p.Status||p.status||'').toLowerCase();
        if(!st.includes('inadimp') && !st.includes('atraso') && !st.includes('vencid')) return;
        const dias = parseInt(p['Dias de Atraso']||p.Dias_Atraso||p.dias_atraso||p.Dias||0);
        const val = parseFloat(p['Valor Corrigido']||p.Valor||p.valor||0);
        let cat;
        if(dias<=30) cat='1 a 30 dias';
        else if(dias<=60) cat='31 a 60 dias';
        else if(dias<=90) cat='61 a 90 dias';
        else if(dias<=120) cat='91 a 120 dias';
        else if(dias<=150) cat='121 a 150 dias';
        else if(dias<=180) cat='151 a 180 dias';
        else cat='Acima de 180 dias';
        inadCategories[cat] += val;
        inadContratos[cat]++;
        totalInad += val;
      });

      // Recebimentos behavior
      const behaviourMap = {};
      recebimentos.forEach(r => {
        const id = r.ID_Contrato||r.id_contrato||Object.values(r)[0];
        if(!behaviourMap[id]) behaviourMap[id]={emDia:0,antecipado:0,'1-30':0,'31-60':0,'61-90':0,'91-120':0,'121-150':0,'151-180':0,'180+':0,total:0};
        const st = String(r['Status Receb.']||r.Status||r.status||'').toLowerCase();
        behaviourMap[id].total++;
        if(st.includes('antecip')) behaviourMap[id].antecipado++;
        else if(st.includes('em dia')||st.includes('dia')) behaviourMap[id].emDia++;
        else {
          const dias = parseInt(r['Dias Atraso']||r.Dias||0);
          if(dias<=30) behaviourMap[id]['1-30']++;
          else if(dias<=60) behaviourMap[id]['31-60']++;
          else if(dias<=90) behaviourMap[id]['61-90']++;
          else if(dias<=120) behaviourMap[id]['91-120']++;
          else if(dias<=150) behaviourMap[id]['121-150']++;
          else if(dias<=180) behaviourMap[id]['151-180']++;
          else behaviourMap[id]['180+']++;
        }
      });

      // Unidades status
      const statusUnidades = {Disponivel:0,'Vendida (Com Saldo)':0,Quitada:0,Permuta:0,Bloqueado:0};
      let totalVGV = 0;
      unidades.forEach(u => {
        const st = String(u.Status||u.status||'');
        const val = parseFloat(u['Valor de venda']||u.Valor||u.valor||0);
        if(st.includes('Dispon')) {statusUnidades.Disponivel++;}
        else if(st.includes('Vendida')||st.includes('Com Saldo')) {statusUnidades['Vendida (Com Saldo)']++; totalVGV+=val;}
        else if(st.includes('Quita')) {statusUnidades.Quitada++;}
        else if(st.includes('Permuta')||st.includes('Bloq')) {statusUnidades.Permuta++;}
      });

      fill.style.width = '90%';

      auditData = {
        params,
        contratos, parcelas, recebimentos, cadastrais, unidades, distratos, extrato,
        totals: {totalSDNominal, totalSDVP, totalElegivel, totalInelegivel, totalParcelas,
                 parcelasPorTipo, sdPorTipo},
        inad: {categories:inadCategories, contratos:inadContratos, total:totalInad},
        behaviour: behaviourMap,
        statusUnidades, totalVGV
      };

      fill.style.width = '100%';

      setTimeout(() => {
        bar.classList.remove('active');
        fill.style.width='0';
        updateStepIndicator();
        updateActionButtons();
        showPreview();
        render();
        selectTab('upload');
      }, 500);

    } catch(err) {
      bar.classList.remove('active');
      fill.querySelector('.fill').style.width='0';
      alert('Erro no processamento: '+err.message);
      console.error(err);
    }
  }, 300);
}

function showPreview() {
  const el = document.querySelector('.preview-summary');
  if(!el || !auditData) return;
  el.classList.add('active');
  const t = auditData.totals;
  el.querySelector('.preview-stats').innerHTML = `
    <div class="preview-stat"><div class="pv">${fmtN(auditData.contratos.length)}</div><div class="pl">Contratos</div></div>
    <div class="preview-stat"><div class="pv">${fmtN(t.totalParcelas)}</div><div class="pl">Parcelas</div></div>
    <div class="preview-stat"><div class="pv">${fmtR(t.totalSDVP)}</div><div class="pl">Saldo Devedor VP</div></div>
    <div class="preview-stat"><div class="pv">${fmtR(t.totalElegivel)}</div><div class="pl">Elegivel</div></div>
  `;
}

// ===================================================================
// XLSX EXPORT
// ===================================================================
function exportarXLSX() {
  if(!auditData) {alert('Processe os dados primeiro.');return;}
  const wb = XLSX.utils.book_new();
  const t = auditData.totals;
  const ad = auditData;
  const model = currentModel;

  // 1. Visao Geral
  const vg = [];
  vg.push(['Auditoria Documental e Financeira dos Recebiveis - Data base: '+ad.params.dataBase]);
  vg.push([]);
  vg.push(['','','Info. Auditada','Info. Cedente']);
  vg.push(['1.','Saldo Devedor VP Taxa Operacao ('+ad.params.cdi+')',fmtR(t.totalSDVP),fmtR(t.totalSDVP)]);
  vg.push(['','Elegivel',fmtR(t.totalElegivel),fmtR(t.totalElegivel)]);
  vg.push(['','Inelegivel',fmtR(t.totalInelegivel),fmtR(t.totalInelegivel)]);
  vg.push([]);
  vg.push(['','','# Parcelas','Saldo Devedor']);
  Object.keys(t.parcelasPorTipo).forEach(tipo => {
    if(t.parcelasPorTipo[tipo]>0||tipo==='Mensal')
      vg.push(['',tipo,t.parcelasPorTipo[tipo],fmtR(t.sdPorTipo[tipo])]);
  });
  vg.push([]);
  vg.push(['6.','Inadimplencia Por Categoria','Contratos','Valor']);
  Object.keys(ad.inad.categories).forEach(cat => {
    vg.push(['',cat,ad.inad.contratos[cat],fmtR(ad.inad.categories[cat])]);
  });
  const wsVG = XLSX.utils.aoa_to_sheet(vg);
  XLSX.utils.book_append_sheet(wb, wsVG, 'Visao Geral');

  // 2. Resumo Unidades
  if(ad.contratos.length) {
    const wsResumo = XLSX.utils.json_to_sheet(ad.contratos);
    XLSX.utils.book_append_sheet(wb, wsResumo, 'Resumo Unidades');
  }

  // 3. Recebimentos
  if(ad.recebimentos.length) {
    const wsReceb = XLSX.utils.json_to_sheet(ad.recebimentos);
    XLSX.utils.book_append_sheet(wb, wsReceb, 'Recebimentos');
  }

  // 4. Behaviour
  const behRows = [['ID_Contrato','Unidade','Cliente','Em dia','Antecipado','1-30','31-60','61-90','91-120','121-150','151-180','Acima 180','Total']];
  Object.entries(ad.behaviour).forEach(([id,b]) => {
    const c = ad.contratos.find(x=>(x.ID_Contrato||x.id_contrato||Object.values(x)[0])===id)||{};
    behRows.push([id,c.Unidade||c.unidade||'',c.Cliente||c.cliente||'',b.emDia,b.antecipado,b['1-30'],b['31-60'],b['61-90'],b['91-120'],b['121-150'],b['151-180'],b['180+'],b.total]);
  });
  const wsBeh = XLSX.utils.aoa_to_sheet(behRows);
  XLSX.utils.book_append_sheet(wb, wsBeh, 'Behaviour');

  // 5. Distratos
  if(ad.distratos.length) {
    const wsDist = XLSX.utils.json_to_sheet(ad.distratos);
    XLSX.utils.book_append_sheet(wb, wsDist, 'Distratos');
  }

  // 6. Recebiveis (parcelas)
  if(ad.parcelas.length) {
    const wsParc = XLSX.utils.json_to_sheet(ad.parcelas);
    XLSX.utils.book_append_sheet(wb, wsParc, model==='previa'?'Recebiveis':'Recebiveis_Neo');
  }

  // 7. Inadimplencia
  const inadRows = [['Periodo de Atraso','Contratos','Parcelas','Total em Atraso']];
  Object.keys(ad.inad.categories).forEach(cat => {
    inadRows.push([cat,ad.inad.contratos[cat],ad.inad.contratos[cat],ad.inad.categories[cat]]);
  });
  inadRows.push(['Total',Object.values(ad.inad.contratos).reduce((a,b)=>a+b,0),Object.values(ad.inad.contratos).reduce((a,b)=>a+b,0),ad.inad.total]);
  const wsInad = XLSX.utils.aoa_to_sheet(inadRows);
  XLSX.utils.book_append_sheet(wb, wsInad, 'Inadimplencia');

  // 8. Base Full
  if(ad.recebimentos.length) {
    const bfCols = ['ID_Contrato','Unidade','Cliente','Empreendimento','Dt Vencim','Dt. Receb.','Valor Reajustado','Valor Recebido'];
    const bfRows = [bfCols];
    ad.recebimentos.forEach(r => {
      bfRows.push(bfCols.map(c => r[c]||r[c.replace(/\s/g,'_')]||r[c.toLowerCase()]||''));
    });
    const wsBF = XLSX.utils.aoa_to_sheet(bfRows);
    XLSX.utils.book_append_sheet(wb, wsBF, 'Base_Full');
  }

  // 9. Espelho de Vendas
  if(ad.unidades.length) {
    const wsEsp = XLSX.utils.json_to_sheet(ad.unidades);
    XLSX.utils.book_append_sheet(wb, wsEsp, 'Espelho de vendas');
  }

  // 10. Conciliacao (if extrato present)
  if(ad.extrato.length && (model==='sem'||model==='com')) {
    const wsConc = XLSX.utils.json_to_sheet(ad.extrato);
    XLSX.utils.book_append_sheet(wb, wsConc, 'Conciliacao');
  }

  // 11. Auditoria Documental
  if(ad.cadastrais.length && model!=='previa') {
    const wsAud = XLSX.utils.json_to_sheet(ad.cadastrais);
    XLSX.utils.book_append_sheet(wb, wsAud, 'Auditoria Documental');
  }

  const modelLabel = model==='sem'?'Sem_Projecao':model==='previa'?'Previa':'Com_Projecao';
  XLSX.writeFile(wb, `Auditoria_Recebiveis_${modelLabel}_${new Date().toISOString().slice(0,10)}.xlsx`);
}

function generateTabContent(tabId, model) {
  switch(tabId) {
    case 'upload': return genUploadPage(model);
    case 'visao': return genVisaoGeral(model);
    case 'estudo': return genEstudoUnidades(model);
    case 'resumo': return genResumoUnidades(model);
    case 'recebimentos': return genRecebimentos(model);
    case 'conciliacao': return genConciliacao(model);
    case 'behaviour': return genBehaviour(model);
    case 'distratos': return genDistratos(model);
    case 'receb_cedente': return genRecebiveis('Cedente', model);
    case 'aging_cedente': return genAging('Cedente', false, model);
    case 'receb_neo': return genRecebiveis('Neo', model);
    case 'aging_neo': return genAging('Neo', false, model);
    case 'aging_ced_proj': return genAging('Cedente', true, model);
    case 'aging_neo_proj': return genAging('Neo', true, model);
    case 'recebiveis': return genRecebiveis('Unico', model);
    case 'aging': return genAging('Unico', false, model);
    case 'inadimplencia': return genInadimplencia(model);
    case 'base_full': return genBaseFull(model);
    case 'espelho': return genEspelhoVendas(model);
    case 'auditoria_doc': return genAuditoriaDocumental(model);
    case 'cessao': return genCessaoCredito(model);
    case 'relacao': return genRelacaoContratos(model);
    default: return '<div class="card"><p>Conteudo em desenvolvimento.</p></div>';
  }
}

function saldoDevedorTable(title, num, rows, cols) {
  const ad = auditData;
  let colHeaders = cols.map(c=>`<th>${c}</th>`).join('');
  let body = rows.map(r => {
    let val = R('0,00');
    if(ad) {
      if(r==='Elegivel') val=fmtR(ad.totals.totalElegivel);
      else if(r==='Inelegivel') val=fmtR(ad.totals.totalInelegivel);
      else if(r==='Total') val=fmtR(ad.totals.totalSDVP);
    }
    let cells = cols.map(()=>`<td class="num">${val}</td>`).join('');
    return `<tr><td class="label">${r}</td>${cells}</tr>`;
  }).join('');
  return `<div class="card"><div class="card-header"><i class="fas fa-coins"></i>${num}. ${title}</div>
    <table class="summary"><thead><tr><th></th>${colHeaders}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function genResumoUnidades(model) {
  const ad = auditData;
  let baseCols = ['ID_Contrato','Unidade','Empreendimento','Cliente','Data Contrato','Valor Venda'];
  if(model==='sem') baseCols = baseCols.concat(['Total A Vencer','Taxa Operacao','Qtde Parcelas','Dif. Valor %','Total Pago','Elegibilidade','Dias Atraso','LTV','Observacao']);
  else if(model==='previa') baseCols = baseCols.concat(['Total A Vencer','Taxa Operacao','Qtde Parcelas','Total Pago','Elegibilidade','Dias Atraso','Observacao']);
  else baseCols = baseCols.concat(['Total A Vencer','Total A Vencer Proj.','Taxa Operacao','Qtde Parcelas','Dif. Valor %','Total Pago','Elegibilidade','Dias Atraso','LTV','Observacao']);

  let rows = '';
  if(ad && ad.contratos.length) {
    ad.contratos.slice(0,100).forEach(c => {
      rows += '<tr>' + baseCols.map(col => {
        const keys = [col,col.replace(/\s/g,'_'),col.toLowerCase(),col.replace(/\s/g,'_').toLowerCase()];
        let v = '';
        for(let k of keys) { if(c[k]!==undefined){v=c[k];break;} }
        if(!v) v = Object.values(c)[baseCols.indexOf(col)] || '-';
        return `<td>${v}</td>`;
      }).join('') + '</tr>';
    });
  } else {
    rows = '<tr>' + baseCols.map(c => `<td>-</td>`).join('') + '</tr>';
  }

function genRecebimentos(model) {
  const ad = auditData;
  let cols = ['ID_Contrato','Unidade','Cliente','Empreendimento','Parcela','Dt Venc.','Data Recebimento','Valor Original','Valor Pago','Status Receb.','Dias Atraso','Tipo Recebimento'];

  let rows = '';
  if(ad && ad.recebimentos.length) {
    ad.recebimentos.slice(0,200).forEach(r => {
      rows += '<tr>' + cols.map(col => {
        const keys = [col,col.replace(/\s/g,'_'),col.replace(/\./g,'')];
        let v = '';
        for(let k of keys) { if(r[k]!==undefined){v=r[k];break;} }
        if(!v) { for(let k of Object.keys(r)) { if(k.toLowerCase().includes(col.toLowerCase().slice(0,6))){v=r[k];break;} } }
        return `<td>${v||'-'}</td>`;
      }).join('') + '</tr>';
    });
    if(ad.recebimentos.length>200) rows += `<tr><td colspan="${cols.length}" style="text-align:center;color:var(--text-light)">... e mais ${ad.recebimentos.length-200} registros</td></tr>`;
  } else {
    rows = '<tr>' + cols.map(()=>`<td>-</td>`).join('') + '</tr>';

  return `<h2 class="section-title"><i class="fas fa-money-bill-wave"></i> Recebimentos</h2>

function genAging(tipo, projetado, model) {
  let label = tipo === 'Unico' ? '' : ` - ${tipo}`;
  let projLabel = projetado ? ' (Projetado)' : '';
  let months = ['Jan/25','Fev/25','Mar/25','Abr/25','Mai/25','Jun/25','Jul/25','Ago/25','Set/25','Out/25','Nov/25','Dez/25'];
  let baseCols = ['ID_Contrato','Unidade','Cliente'];
  let endCols = ['Total Geral','Inadimplencia','Total VP Op.'];
  if(tipo==='Neo'||tipo==='Unico') endCols = endCols.concat(['Parcelas em atraso','Total Recebido','% INAD/FATURADO']);
  let allCols = baseCols.concat(months).concat(endCols);

  let row = allCols.map(c => {
    let v = ['ID_Contrato','Unidade','Cliente'].includes(c) ?
      (c==='ID_Contrato'?'CTR-0001':c==='Unidade'?'UN-101':'Exemplo') :
      c.includes('%') ? P() : c.includes('Parcelas') ? '0' : R();
    return `<td class="${!['ID_Contrato','Unidade','Cliente'].includes(c)?'num':''}">${v}</td>`;
  }).join('');

  return `<h2 class="section-title"><i class="fas fa-clock"></i> Aging${label}${projLabel}</h2>
    <div class="card"><div class="table-wrap"><table class="data"><thead><tr>
    ${allCols.map(c=>`<th>${c}</th>`).join('')}
    </tr></thead><tbody><tr>${row}</tr></tbody></table></div></div>`;
}

function genInadimplencia(model) {
  const ad = auditData;
  const cats = ['1 a 30 dias','31 a 60 dias','61 a 90 dias','91 a 120 dias','121 a 150 dias','151 a 180 dias','Acima de 180 dias'];
  let totalC = 0, totalP = 0, totalV = 0;

  let inadRows = cats.map(c => {
    const n = ad ? ad.inad.contratos[c] : 0;
    const v = ad ? ad.inad.categories[c] : 0;
    const pct = ad&&ad.inad.total>0 ? fmtP(v/ad.inad.total) : P();
    totalC += n; totalP += n; totalV += v;
    return `<tr><td>${c}</td><td class="num">${n}</td><td class="num">${n}</td><td class="num">${ad?fmtR(v):R()}</td><td class="num">${pct}</td></tr>`;
  }).join('');

  let summary = `<div class="card"><div class="card-header"><i class="fas fa-exclamation-triangle"></i>Posicao de Inadimplencia</div>
    <div class="grid-2">
      <div><table class="summary"><tbody>
        ${summaryRow('Data Base',ad?ad.params.dataBase:D())}
        ${summaryRow('Saldo Devedor da Carteira',ad?fmtR(ad.totals.totalSDVP):R())}
      </tbody></table></div><div></div>
    </div>
    <div class="table-wrap" style="margin-top:12px"><table class="data"><thead><tr>
      <th>Periodo</th><th>Contratos</th><th>Parcelas</th><th>Total em Atraso</th><th>%</th>
    </tr></thead><tbody>
    ${inadRows}
    <tr class="total"><td><strong>Total</strong></td><td class="num"><strong>${totalC}</strong></td><td class="num"><strong>${totalP}</strong></td><td class="num"><strong>${ad?fmtR(totalV):R()}</strong></td><td class="num"><strong>100,00%</strong></td></tr>
    </tbody></table></div></div>`;

  return `<h2 class="section-title"><i class="fas fa-exclamation-triangle"></i> Inadimplencia</h2>${summary}`;
}
